[tool.poetry]
name = "auto-clicker"
version = "1.3.1"
description = "Windows 11で画面上の座標を指定して繰り返しクリックさせるアプリ"
authors = ["kuwanomi0"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.8,<3.13"
pyautogui = "^0.9.54"
keyboard = "^0.13.5"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
